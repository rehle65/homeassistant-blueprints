blueprint:
  name: "❄️ Klimaanlage – Anwesenheit & Saison"
  description: >-
    Version 1.3.1 | https://github.com/rehle65/homeassistant-blueprints

    Steuert Klimageraete automatisch: Heizen im Winter, Kuehlen im Sommer,
    Anwesenheitserkennung mit Eco-Modus, Tag-/Nacht-Temperaturen (nur bei
    Anwesenheit), Hysterese gegen Short-Cycling, minimale Laufzeit zum
    Kompressorschutz, optionale Fenster-offen-Erkennung.

  domain: automation
  source_url: https://github.com/rehle65/homeassistant-blueprints/blob/main/blueprints/automation/climate_presence.yaml

  input:

    climate_entity:
      name: "Klimagerät"
      description: >
        Die Home-Assistant-Entität deines Klimageräts (z. B.
        climate.wohnzimmer). Das Blueprint steuert genau dieses Gerät.
      selector:
        entity:
          domain: climate

    presence_sensor:
      name: "Anwesenheitssensor"
      description: >
        Ein binärer Sensor oder eine Personenentität, die anzeigt, ob jemand
        zuhause ist. Zustand 'on' bzw. 'home' = anwesend, alles andere =
        abwesend. Beispiel: binary_sensor.jemand_zuhause oder person.roland.
      selector:
        entity:
          domain:
            - binary_sensor
            - person
            - input_boolean

    outdoor_temp_sensor:
      name: "Außentemperatur-Sensor"
      description: >
        Sensor, der die aktuelle Außentemperatur in °C liefert. Liegt der Wert
        über dem Sommer-Schwellwert, schaltet die Anlage in den Kühlmodus;
        darunter in den Heizemodus. Beispiel: sensor.aussentemperatur.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    indoor_temp_sensor:
      name: "Innentemperatur-Sensor"
      description: >
        Sensor für die aktuelle Raumtemperatur (°C). Wird genutzt, um zu
        prüfen, ob die Zieltemperatur bereits erreicht wurde, und die Anlage
        ggf. in den Fan-Only-Modus zu versetzen. Beispiel:
        sensor.wohnzimmer_temperatur.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    summer_threshold:
      name: "Sommer-Schwellwert (°C)"
      description: >
        Ab dieser Außentemperatur gilt Sommer-/Kühlmodus. Liegt die
        Außentemperatur dauerhaft darunter, wird geheizt. Empfehlung: 18–22 °C.
        Standard: 20 °C.
      default: 20
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    target_temp_day_cool:
      name: "Zieltemperatur Kühlen – Tag (°C)"
      description: >
        Gewünschte Raumtemperatur tagsüber im Kühlbetrieb (Sommer).
        Empfehlung: 22–26 °C. Standard: 24 °C.
      default: 24
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    target_temp_night_cool:
      name: "Zieltemperatur Kühlen – Nacht (°C)"
      description: >
        Gewünschte Raumtemperatur nachts im Kühlbetrieb. Gilt nur wenn der
        Anwesenheitssensor 'zuhause' meldet – bei Abwesenheit greift stattdessen
        der Eco-Modus. Sollte etwas höher als die Tagestemperatur liegen.
        Standard: 26 °C.
      default: 26
      selector:
        number:
          min: 18
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    target_temp_day_heat:
      name: "Zieltemperatur Heizen – Tag (°C)"
      description: >
        Gewünschte Raumtemperatur tagsüber im Heizbetrieb (Winter).
        Empfehlung: 20–22 °C. Standard: 21 °C.
      default: 21
      selector:
        number:
          min: 14
          max: 26
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    target_temp_night_heat:
      name: "Zieltemperatur Heizen – Nacht (°C)"
      description: >
        Gewünschte Raumtemperatur nachts im Heizbetrieb. Gilt nur wenn der
        Anwesenheitssensor 'zuhause' meldet – bei Abwesenheit greift stattdessen
        der Eco-Modus. Typischerweise niedriger als der Tageswert.
        Standard: 18 °C.
      default: 18
      selector:
        number:
          min: 12
          max: 22
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    away_temp_offset:
      name: "Abwesenheits-Versatz (°C)"
      description: >
        Wenn niemand zuhause ist, wird die Tages-Zieltemperatur um diesen Wert
        angepasst – beim Heizen nach unten, beim Kühlen nach oben. Das Gerät
        wechselt dabei in den Eco-Preset (sofern unterstützt), um Energie zu
        sparen. Standard: 3 °C. Auf 0 setzen um den Versatz zu deaktivieren.
      default: 3
      selector:
        number:
          min: 0
          max: 8
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    night_start:
      name: "Nachtbeginn"
      description: >
        Uhrzeit, ab der die Nacht-Zieltemperatur gilt (nur bei Anwesenheit).
        Beispiel: 22:00.
      default: "22:00:00"
      selector:
        time: {}

    night_end:
      name: "Nachtende"
      description: >
        Uhrzeit, ab der wieder die Tages-Zieltemperatur gilt.
        Beispiel: 07:00.
      default: "07:00:00"
      selector:
        time: {}

    hysteresis:
      name: "Hysterese (°C)"
      description: >
        Toleranzbereich um die Zieltemperatur, der verhindert, dass das Gerät
        ständig ein- und ausschaltet wenn die Raumtemperatur knapp um den
        Zielwert schwankt. Standard: 0,5 °C.
      default: 0.5
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

    min_runtime:
      name: "Minimale Laufzeit (Minuten)"
      description: >
        Das Gerät läuft mindestens diese Anzahl Minuten weiter, bevor es in den
        Fan-Only-Modus wechseln darf. Schützt den Kompressor vor zu häufigem
        Starten und Stoppen. Standard: 10 Minuten. Auf 0 deaktivieren.
      default: 10
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "min"
          mode: slider

    use_window:
      name: "Fenster-Erkennung aktivieren"
      description: >
        Wenn aktiviert, schaltet das Klimagerät automatisch ab sobald ein
        Fenster geöffnet wird – und startet es wieder wenn das Fenster
        geschlossen wird. Erfordert einen Fenstersensor (binary_sensor).
      default: false
      selector:
        boolean: {}

    window_sensor:
      name: "Fenstersensor"
      description: >
        Binärer Sensor, der den Fensterzustand meldet. Zustand 'on' = Fenster
        offen → Gerät wird ausgeschaltet. Zustand 'off' = Fenster geschlossen
        → Normalbetrieb wird wieder aufgenommen.
        Beispiel: binary_sensor.fenster_wohnzimmer.
        Wird nur ausgewertet wenn die Fenster-Erkennung aktiviert ist.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - window
            - door
            - opening

# ──────────────────────────────────────────────────────────────────────────────
# Variablen: einmalig berechnen, damit Conditions übersichtlich bleiben
# ──────────────────────────────────────────────────────────────────────────────
variables:
  outdoor_temp: "{{ states(outdoor_temp_sensor) | float(20) }}"
  indoor_temp:  "{{ states(indoor_temp_sensor)  | float(20) }}"
  is_summer:    "{{ outdoor_temp >= summer_threshold }}"
  is_night: >
    {% set now_time = now().strftime('%H:%M:%S') %}
    {% if night_start <= night_end %}
      {{ now_time >= night_start and now_time < night_end }}
    {% else %}
      {{ now_time >= night_start or now_time < night_end }}
    {% endif %}
  is_present: >
    {% set state = states(presence_sensor) %}
    {{ state in ['on', 'home'] }}
  # Fenster offen? Nur auswerten wenn Feature aktiviert und Sensor gesetzt
  window_open: >
    {% if use_window and window_sensor != [] and window_sensor != '' %}
      {{ states(window_sensor) == 'on' }}
    {% else %}
      {{ false }}
    {% endif %}
  # Laufzeit des Geräts in Minuten (0 wenn nicht aktiv oder unbekannt)
  runtime_minutes: >
    {% set last_changed = states[climate_entity].last_changed %}
    {% set current_mode = states(climate_entity) %}
    {% if current_mode in ['heat', 'cool'] and last_changed is not none %}
      {{ ((now() - last_changed).total_seconds() / 60) | round(1) }}
    {% else %}
      {{ 999 }}
    {% endif %}
  min_runtime_active: "{{ runtime_minutes < min_runtime }}"
  # Rohe Zieltemperatur je Modus und Tageszeit – NUR bei Anwesenheit Nacht nutzen
  raw_target: >
    {% if is_summer %}
      {% if is_night and is_present %}{{ target_temp_night_cool }}{% else %}{{ target_temp_day_cool }}{% endif %}
    {% else %}
      {% if is_night and is_present %}{{ target_temp_night_heat }}{% else %}{{ target_temp_day_heat }}{% endif %}
    {% endif %}
  # Abwesenheitskorrektur
  effective_target: >
    {% if is_present %}
      {{ raw_target }}
    {% else %}
      {% if is_summer %}
        {{ raw_target + away_temp_offset }}
      {% else %}
        {{ raw_target - away_temp_offset }}
      {% endif %}
    {% endif %}
  hvac_mode: "{{ 'cool' if is_summer else 'heat' }}"
  use_eco: "{{ not is_present and away_temp_offset > 0 }}"
  threshold_fan:  "{{ effective_target - hysteresis if is_summer else effective_target + hysteresis }}"
  threshold_heat: "{{ effective_target + hysteresis if is_summer else effective_target - hysteresis }}"

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: bei Zustandsänderungen neu auswerten
# ──────────────────────────────────────────────────────────────────────────────
trigger:
  - platform: state
    entity_id: !input presence_sensor

  # Außentemperatur entprellen: viele Wetterstationen liefern bei Hitze
  # minutengenaue 0,1-°C-Schwankungen und würden die Automatisierung sonst
  # Dutzende Male pro Stunde triggern.
  - platform: state
    entity_id: !input outdoor_temp_sensor
    for:
      minutes: 5

  - platform: state
    entity_id: !input indoor_temp_sensor
    for:
      minutes: 2

  - platform: time
    at: !input night_start

  - platform: time
    at: !input night_end

  # Fenstersensor – sofort reagieren wenn Fenster geöffnet/geschlossen wird
  - platform: state
    entity_id: !input window_sensor
    id: window_change

  # Beim HA-Start initialisieren
  - platform: homeassistant
    event: start

# ──────────────────────────────────────────────────────────────────────────────
# Aktion
# ──────────────────────────────────────────────────────────────────────────────
action:
  - choose:

      # ── Fenster offen → Gerät ausschalten ────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ window_open }}"
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: "off"

      # ── Zieltemperatur mit Hysterese erreicht UND Mindestlaufzeit abgelaufen
      #    → Fan-Only ─────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: >
              {% if is_summer %}
                {{ indoor_temp <= threshold_fan and not min_runtime_active }}
              {% else %}
                {{ indoor_temp >= threshold_fan and not min_runtime_active }}
              {% endif %}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: "fan_only"

      # ── Temperatur hat Hysterese-Schwelle überschritten (Kühlen) /
      #    unterschritten (Heizen) → Aktiv kühlen/heizen ─────────────────────
      - conditions:
          - condition: template
            value_template: >
              {% if is_summer %}
                {{ indoor_temp >= threshold_heat }}
              {% else %}
                {{ indoor_temp <= threshold_heat }}
              {% endif %}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: "{{ hvac_mode }}"

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ effective_target }}"

          # Eco-Preset bei Abwesenheit setzen (wenn Gerät es unterstützt)
          - if:
              - condition: template
                value_template: "{{ use_eco }}"
            then:
              - service: climate.set_preset_mode
                target:
                  entity_id: !input climate_entity
                data:
                  preset_mode: "eco"
                continue_on_error: true

    # ── Temperatur liegt innerhalb der Hysterese oder Mindestlaufzeit läuft
    #    noch → nichts tun ───────────────────────────────────────────────────
    default: []

mode: single
max_exceeded: silent
